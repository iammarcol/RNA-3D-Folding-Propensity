{{ define "main" }}

<section class="hero">
  <div>
    <p class="eyebrow">Rfam family models</p>
    <h1>3D folding propensity</h1>
    <p class="hero-text">
      Search for an Rfam family, open the model page,
      and inspect the predicted RNA structure and its 3D folding propensity score.
    </p>
  </div>
</section>

<section class="search-section">
  <h2>Search models</h2>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Search Rfam ID, e.g. RF00001"
      autocomplete="off"
    >
  </div>

  <div id="searchResults" class="search-results"></div>
</section>

<script src="/js/search.js"></script>

{{ end }}
